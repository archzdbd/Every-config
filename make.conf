# COMPILER TUNING
COMMON_FLAGS="-O2 -march=znver3 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,--fuse-ld=mold"

MAKEOPTS="-j12 -l10"
EMERGE_DEFAULT_OPTS="--ask --verbose --tree --jobs=1 --load-average=10"
  
FEATURES="sandbox parallel-fetch protect-owned splitdebug"

USE="bluetooth alsa dbus dri encode jit modules mp3 mp4 nvidia opengl udev unicode vulkan -cups -doc -debug -handbook -introspection -man -nls -test -telemetry -xinerama"

CPU_FLAGS_X86="aes avx avx2 fma3 mmx mmxext popcnt sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3"

VIDEO_CARDS="nvidia"

ACCEPT_LICENSE="*"

